<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reviews — Eternal Bliss</title>
  <link rel="stylesheet" href="../../../index.css" />
  <link rel="stylesheet" href="ratings.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    .nav-cats {
      visibility: hidden;
    }

    .nav-back-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      border-radius: 24px;
      border: 1px solid rgba(139, 58, 58, 0.25);
      background: transparent;
      font-family: var(--font-body, "Jost", sans-serif);
      font-size: 0.74rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--deep-rose, #8b3a3a);
      text-decoration: none;
      transition: background 0.22s, border-color 0.22s, transform 0.22s;
    }

    .nav-back-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .nav-back-btn:hover {
      background: rgba(139, 58, 58, 0.07);
      border-color: rgba(139, 58, 58, 0.50);
      transform: translateX(-2px);
    }
  </style>
</head>

<body>

  <!-- ═══ NAVBAR ═══ -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <div class="nav-cats">
        <!-- nav links removed -->
      </div>
      <a href="../../../index.html" class="nav-logo">
        <span class="nav-logo-small">Eternal</span>
        <span class="nav-logo-large">Bliss</span>
      </a>
      <div class="nav-actions">
        <a href="../../../index.html" class="nav-back-btn">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          Back to Menu
        </a>
      </div>
    </div>
  </nav>

  <div class="ru-page">

    <!-- ═══ HERO ═══ -->
    <div class="ru-hero">
      <div class="ru-hero-bg">
        <div class="ru-blob b1"></div>
        <div class="ru-blob b2"></div>
      </div>
      <div class="ru-hero-content">
        <span class="ru-eyebrow">What Our Couples Say</span>
        <h1 class="ru-hero-title">Reviews &amp;<br /><em>Ratings</em></h1>
        <p class="ru-hero-sub">Real experiences from real couples — honest, heartfelt and unfiltered.</p>

      </div>
    </div>

    <div class="ru-content">

      <!-- ═══ LEAVE A REVIEW ═══ -->
      <section class="ru-section" id="leave-review">
        <div class="ru-section-head">
          <span class="ru-section-tag">Share Your Story</span>
          <h2 class="ru-section-title">Leave a Review</h2>
        </div>

        <div class="ru-form-card">
          <div class="ru-form">
            <div class="ru-form-row">
              <div class="ru-field">
                <label class="ru-label">Your Name</label>
                <div class="ru-input-wrap">
                  <svg class="ru-input-icon" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.4" />
                    <path d="M4 20c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="currentColor" stroke-width="1.4"
                      stroke-linecap="round" />
                  </svg>
                  <input type="text" id="fName" class="ru-input" placeholder="e.g. Amara &amp; James" />
                </div>
              </div>
              <div class="ru-field">
                <label class="ru-label">Event / Service</label>
                <div class="ru-input-wrap">
                  <svg class="ru-input-icon" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2l2.4 5 5.6.8-4 3.9.9 5.3L12 14.5 7.1 17l.9-5.3L4 7.8l5.6-.8z" stroke="currentColor"
                      stroke-width="1.4" stroke-linejoin="round" />
                  </svg>
                  <input type="text" id="fService" class="ru-input" placeholder="e.g. Wedding Reception" />
                </div>
              </div>
            </div>

            <div class="ru-field">
              <label class="ru-label">Your Experience</label>
              <textarea id="fText" class="ru-input ru-textarea"
                placeholder="Tell us about your special day…"></textarea>
            </div>

            <div class="ru-field">
              <label class="ru-label">Rating</label>
              <div class="ru-star-picker" id="starPicker">
                <input type="radio" name="rating" id="star5" value="5"><label for="star5">★</label>
                <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
                <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
                <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
                <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
              </div>
            </div>

            <div class="ru-notice" id="ru-notice" style="display:none;"></div>

            <button class="ru-submit-btn" onclick="submitReview()">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
                <path d="M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              Submit Review
            </button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- ═══ FOOTER ═══ -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="fb-small">Eternal</span>
        <span class="fb-large">Bliss</span>
      </div>
      <p class="footer-copy">© 2025 Eternal Bliss Wedding Planning. All rights reserved.</p>
      <div class="footer-ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
    </div>
  </footer>

  <script>
    const API = '/api/reviews';

    // Navbar scroll
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 60);
    });

    let reviews = [];
    let currentFilter = 'all';

    // ── Load reviews from DB ──
    async function loadReviews() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error('Failed to load');
        reviews = await res.json();
        renderCards();
      } catch (e) {
        console.error('Could not fetch reviews:', e);
      }
    }

    function renderCards() {
      let list = [...reviews];
      if (currentFilter === 'low') list = list.filter(r => r.rating <= 2);
      else if (currentFilter !== 'all') list = list.filter(r => r.rating === currentFilter);

      const container = document.getElementById('reviewCards');
      const empty     = document.getElementById('ruEmpty');
      container.innerHTML = '';

      if (!list.length) { empty.style.display = 'flex'; return; }
      empty.style.display = 'none';

      list.forEach((r, i) => {
        const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        container.innerHTML += `
          <div class="ru-card" style="animation:fade-up 0.45s ease ${i * 0.07}s both">
            <div class="ru-card-top">
              <div class="ru-card-avatar">${r.customerName.charAt(0)}</div>
              <div class="ru-card-meta">
                <span class="ru-card-name">${r.customerName}</span>
                <span class="ru-card-service">${r.eventService || ''}</span>
              </div>
              <div class="ru-card-stars">${stars}</div>
            </div>
            <p class="ru-card-text">"${r.experience}"</p>
          </div>`;
      });
    }

    function setFilter(val, btn) {
      currentFilter = val;
      document.querySelectorAll('.ru-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    }

    // ── Submit review to DB ──
    async function submitReview() {
      const name    = document.getElementById('fName').value.trim();
      const service = document.getElementById('fService').value.trim();
      const text    = document.getElementById('fText').value.trim();
      const picked  = document.querySelector('input[name="rating"]:checked');
      const notice  = document.getElementById('ru-notice');

      if (!name || !text || !picked) {
        notice.textContent = 'Please fill in your name, review text, and select a rating.';
        notice.className = 'ru-notice error';
        notice.style.display = 'block';
        return;
      }

      const payload = {
        customerName: name,
        eventService: service || 'General',
        experience:   text,
        rating:       parseInt(picked.value)
      };

      try {
        const res = await fetch(API, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Submission failed');

        document.getElementById('fName').value    = '';
        document.getElementById('fService').value = '';
        document.getElementById('fText').value    = '';
        picked.checked = false;

        notice.textContent = '✓  Thank you! Your review has been submitted.';
        notice.className = 'ru-notice success';
        notice.style.display = 'block';
        setTimeout(() => { notice.style.display = 'none'; }, 3500);

        await loadReviews();
      } catch (e) {
        notice.textContent = 'Something went wrong. Please try again.';
        notice.className = 'ru-notice error';
        notice.style.display = 'block';
        console.error(e);
      }
    }

    loadReviews();
  </script>

</body>

</html>
